name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [temurin, corretto, zulu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (${{ matrix.distribution }})
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: ${{ matrix.distribution }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew unitTest

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.distribution }}
          path: |
            build/test-results/unitTest/
            build/reports/tests/unitTest/

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedule_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run API tests
        run: ./gradlew apiTest
        env:
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          FACEBOOK_CLIENT_ID: dummy
          FACEBOOK_CLIENT_SECRET: dummy

      - name: Publish API test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'build/test-results/apiTest/TEST-*.xml'
          check_name: API Test Report

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            build/test-results/apiTest/
            build/reports/tests/apiTest/

  test-report:
    name: Publish Combined Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    if: always()

    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Upload combined test report
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-report
          path: all-results/
